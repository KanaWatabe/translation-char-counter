<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>翻訳文字数カウンター</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Hiragino Sans', sans-serif;
      background: #f0f2f5;
      color: #1a1a1a;
      min-height: 100vh;
    }

    .container {
      max-width: 820px;
      margin: 0 auto;
      padding: 48px 20px 80px;
    }

    .header { margin-bottom: 32px; }
    .header h1 { font-size: 22px; font-weight: 700; color: #111; margin-bottom: 6px; }
    .header p { font-size: 14px; color: #888; line-height: 1.6; }

    .input-row { display: flex; gap: 10px; margin-bottom: 12px; }

    .url-input {
      flex: 1;
      padding: 13px 16px;
      border: 2px solid #e0e0e0;
      border-radius: 10px;
      font-size: 15px;
      outline: none;
      background: white;
      transition: border-color 0.2s;
    }
    .url-input:focus { border-color: #5b4cf5; }

    .options-row {
      display: flex;
      align-items: center;
      gap: 20px;
      margin-bottom: 28px;
      font-size: 13px;
      color: #666;
    }
    .options-row label { display: flex; align-items: center; gap: 6px; cursor: pointer; }

    .analyze-btn {
      padding: 13px 28px;
      background: #5b4cf5;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.2s;
    }
    .analyze-btn:hover { background: #4a3ce0; }
    .analyze-btn:disabled { background: #b0aee8; cursor: not-allowed; }

    .stop-btn {
      padding: 13px 20px;
      background: #fff;
      color: #e53e3e;
      border: 2px solid #e53e3e;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      display: none;
    }
    .stop-btn:hover { background: #fff5f5; }

    .error-box {
      background: #fff0f0;
      border: 1px solid #f5c6c6;
      color: #c0392b;
      padding: 12px 16px;
      border-radius: 10px;
      font-size: 14px;
      margin-bottom: 20px;
      display: none;
    }

    /* Progress */
    .progress-wrap {
      background: white;
      border-radius: 14px;
      padding: 24px 28px;
      margin-bottom: 24px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
      display: none;
    }
    .progress-label {
      font-size: 14px;
      color: #555;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
    }
    .progress-bar-bg {
      height: 6px;
      background: #ede9ff;
      border-radius: 99px;
      overflow: hidden;
    }
    .progress-bar-fill {
      height: 100%;
      background: #5b4cf5;
      border-radius: 99px;
      width: 0%;
      transition: width 0.3s ease;
    }
    .progress-current {
      font-size: 12px;
      color: #aaa;
      margin-top: 8px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Grand total */
    .grand-total {
      background: white;
      border-radius: 14px;
      padding: 24px 32px;
      margin-bottom: 20px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
      display: flex;
      align-items: center;
      gap: 32px;
    }
    .grand-total-main { flex: 1; }
    .grand-total-label { font-size: 13px; color: #999; margin-bottom: 4px; }
    .grand-total-count { font-size: 52px; font-weight: 800; color: #5b4cf5; line-height: 1; }
    .grand-total-unit { font-size: 15px; color: #888; margin-top: 4px; }
    .grand-total-meta { text-align: right; color: #bbb; font-size: 13px; line-height: 2; }
    .copy-btn {
      padding: 8px 18px;
      background: #f0eeff;
      color: #5b4cf5;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 10px;
      display: block;
      transition: background 0.2s;
    }
    .copy-btn:hover { background: #e0dbff; }

    /* Page list */
    .section-label {
      font-size: 12px;
      font-weight: 700;
      color: #bbb;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      margin-bottom: 10px;
      padding-left: 4px;
    }

    .page-list { display: flex; flex-direction: column; gap: 10px; }

    .page-card {
      background: white;
      border-radius: 12px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.07);
      overflow: hidden;
    }

    .page-header {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 16px 20px;
      cursor: pointer;
      transition: background 0.15s;
    }
    .page-header:hover { background: #fafafa; }

    .page-chevron {
      color: #ccc;
      font-size: 13px;
      flex-shrink: 0;
      transition: transform 0.2s;
    }
    .page-card.open .page-chevron { transform: rotate(90deg); }

    .page-info { flex: 1; min-width: 0; }
    .page-title { font-size: 14px; font-weight: 600; color: #222; margin-bottom: 3px; }
    .page-url {
      font-size: 12px;
      color: #aaa;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .page-count { font-size: 20px; font-weight: 700; color: #444; flex-shrink: 0; text-align: right; }
    .page-count span { font-size: 11px; color: #bbb; font-weight: 400; display: block; }

    .exclude-check {
      width: 18px;
      height: 18px;
      accent-color: #e53e3e;
      flex-shrink: 0;
      cursor: pointer;
    }
    .page-card.excluded { opacity: 0.4; }
    .page-card.excluded .page-count { text-decoration: line-through; color: #bbb; }

    /* Sections inside page */
    .page-sections {
      display: none;
      border-top: 1px solid #f3f3f3;
      padding: 0 20px 16px;
    }
    .page-card.open .page-sections { display: block; }

    .page-link {
      font-size: 11px;
      color: #5b4cf5;
      text-decoration: none;
      flex-shrink: 0;
      opacity: 0.6;
      transition: opacity 0.2s;
    }
    .page-link:hover { opacity: 1; }

    .sec-row {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 12px 0;
      border-bottom: 1px solid #f5f5f5;
    }
    .sec-row:last-child { border-bottom: none; }
    .sec-row.excluded-sec { opacity: 0.35; }
    .sec-row.excluded-sec .sec-count { text-decoration: line-through; color: #ccc; }

    .exclude-sec-check {
      width: 15px;
      height: 15px;
      accent-color: #e53e3e;
      flex-shrink: 0;
      margin-top: 3px;
      cursor: pointer;
    }

    .sec-info { flex: 1; min-width: 0; }
    .sec-title { font-size: 13px; font-weight: 700; color: #333; margin-bottom: 6px; }
    .sec-fulltext {
      font-size: 12px;
      color: #555;
      line-height: 1.8;
      white-space: pre-wrap;
      word-break: break-all;
      border: 1.5px solid transparent;
      border-radius: 6px;
      padding: 6px 8px;
      margin: -6px -8px;
      cursor: text;
      transition: border-color 0.15s, background 0.15s;
      outline: none;
    }
    .sec-fulltext:hover {
      border-color: #ddd;
      background: #fafafa;
    }
    .sec-fulltext:focus {
      border-color: #5b4cf5;
      background: #fff;
    }
    .sec-count { font-size: 15px; font-weight: 700; color: #666; flex-shrink: 0; text-align: right; min-width: 52px; }
    .sec-count span { font-size: 10px; color: #ccc; font-weight: 400; display: block; }

    .results-wrap { display: none; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>翻訳文字数カウンター</h1>
      <p>URLを入力するとサイト内ページを自動収集し、本文テキストの文字数をページごとにカウントします</p>
    </div>

    <div class="input-row">
      <input class="url-input" id="urlInput" type="url" placeholder="https://example.com" />
      <button class="analyze-btn" id="analyzeBtn" onclick="startCrawl()">カウント開始</button>
      <button class="stop-btn" id="stopBtn" onclick="stopCrawl()">停止</button>
    </div>

    <div class="options-row">
      <span>最大取得ページ数:</span>
      <label><input type="radio" name="maxPages" value="20" checked> 20ページ</label>
      <label><input type="radio" name="maxPages" value="50"> 50ページ</label>
      <label><input type="radio" name="maxPages" value="100"> 100ページ</label>
    </div>

    <div class="options-row">
      <span style="flex-shrink:0">除外URLパターン:</span>
      <input id="excludeInput" type="text" value="news"
        placeholder="news, blog（カンマ区切りで複数指定可）"
        style="flex:1; padding:7px 12px; border:1px solid #ddd; border-radius:8px; font-size:13px; outline:none;">
    </div>

    <div class="error-box" id="errorBox"></div>

    <div class="progress-wrap" id="progressWrap">
      <div class="progress-label">
        <span id="progressText">ページを収集しています...</span>
        <span id="progressCount">0 / ?</span>
      </div>
      <div class="progress-bar-bg"><div class="progress-bar-fill" id="progressFill"></div></div>
      <div class="progress-current" id="progressCurrent"></div>
    </div>

    <div class="results-wrap" id="resultsWrap">
      <div class="grand-total">
        <div class="grand-total-main">
          <div class="grand-total-label">全ページ合計文字数</div>
          <div class="grand-total-count" id="grandTotal">0</div>
          <div class="grand-total-unit">文字（スペース除く）</div>
          <button class="copy-btn" onclick="copyTotal()">合計をコピー</button>
        </div>
        <div class="grand-total-meta" id="grandMeta"></div>
      </div>

      <div class="section-label">ページ別</div>
      <div class="page-list" id="pageList"></div>
    </div>
  </div>

  <script>
    const PROXIES = [
      {
        url: u => `https://api.codetabs.com/v1/proxy/?quest=${encodeURIComponent(u)}`,
        parse: res => res.text()
      },
      {
        url: u => `https://api.allorigins.win/get?url=${encodeURIComponent(u)}`,
        parse: async res => { const d = await res.json(); return d.contents; }
      },
    ];
    const DELAY = 400; // ms between requests

    let shouldStop = false;
    let grandTotalValue = 0;

    function getMaxPages() {
      return parseInt(document.querySelector('input[name="maxPages"]:checked').value);
    }

    async function fetchPage(url) {
      for (const proxy of PROXIES) {
        try {
          const res = await fetch(proxy.url(url), { signal: AbortSignal.timeout(12000) });
          if (!res.ok) continue;
          const html = await proxy.parse(res);
          if (html && html.length > 100) return html;
        } catch (_) {}
      }
      throw new Error('取得失敗');
    }

    function parseDoc(html) {
      return new DOMParser().parseFromString(html, 'text/html');
    }

    function cleanDoc(doc) {
      [
        'nav', 'header', 'footer', 'aside', 'menu',
        'script', 'style', 'noscript', 'iframe', 'svg',
        'button', 'input', 'select', 'textarea', 'form',
        '[role="navigation"]', '[role="banner"]', '[role="contentinfo"]', '[role="complementary"]',
        '.nav', '.navigation', '.header', '.footer', '.sidebar', '.menu', '.breadcrumb', '.gnav', '.lnav',
        '#nav', '#navigation', '#header', '#footer', '#sidebar',
      ].forEach(sel => {
        try { doc.querySelectorAll(sel).forEach(el => el.remove()); } catch (_) {}
      });
      return doc;
    }

    function getMainContent(doc) {
      return (
        doc.querySelector('main') ||
        doc.querySelector('article') ||
        doc.querySelector('[role="main"]') ||
        doc.querySelector('#main') ||
        doc.querySelector('#content') ||
        doc.querySelector('.main') ||
        doc.querySelector('.content') ||
        doc.querySelector('.post') ||
        doc.querySelector('.entry') ||
        doc.body
      );
    }

    // /en/ /ko/ /zh/ など言語サブディレクトリのパターン
    const LANG_PATH_RE = /\/(en|ko|zh|tw|fr|de|es|it|pt|ru|ar|vi|th|id|zh-cn|zh-tw)(\/|$)/i;

    function extractInternalLinks(doc, baseHostname, currentUrl, basePath, excludePatterns = []) {
      const links = new Set();
      doc.querySelectorAll('a[href]').forEach(a => {
        try {
          const href = a.getAttribute('href');
          if (!href) return;
          if (/^(#|mailto:|tel:|javascript:)/i.test(href)) return;
          const u = new URL(href, currentUrl);
          if (u.hostname !== baseHostname) return;
          // Skip common non-content extensions
          if (/\.(pdf|zip|jpg|jpeg|png|gif|svg|mp4|mp3|webp|ico|css|js)(\?|$)/i.test(u.pathname)) return;
          // Skip language variant pages (e.g. /en/, /ko/)
          const relPath = u.pathname.slice(basePath.length);
          if (LANG_PATH_RE.test('/' + relPath)) return;
          // Skip user-specified exclude patterns
          const pathLower = u.pathname.toLowerCase();
          if (excludePatterns.some(p => pathLower.includes('/' + p + '/'))) return;
          // Normalize: strip query params and hash (same path = same page)
          u.search = '';
          u.hash = '';
          links.add(u.toString());
        } catch (_) {}
      });
      return [...links];
    }

    function extractSections(root) {
      const sections = [];
      let current = null;

      const countChars = t => t.replace(/\s/g, '').length;
      const getText = el => (el.textContent || '').replace(/\s+/g, ' ').trim();
      const TEXT_TAGS = new Set(['P', 'LI', 'DT', 'DD', 'BLOCKQUOTE', 'FIGCAPTION', 'CAPTION', 'TD', 'TH']);
      const HEADING = /^H[1-6]$/;

      function pushText(text) {
        if (!current) {
          current = { title: 'はじめ', texts: [], count: 0 };
          sections.push(current);
        }
        current.texts.push(text);
        current.count += countChars(text);
      }

      function walk(el) {
        if (!el || el.nodeType !== 1) return;
        const tag = (el.tagName || '').toUpperCase();

        if (HEADING.test(tag)) {
          const title = getText(el);
          if (title) { current = { title, texts: [], count: 0 }; sections.push(current); }
          return;
        }
        if (TEXT_TAGS.has(tag)) {
          const text = getText(el);
          if (text && countChars(text) > 0) pushText(text);
          return;
        }
        if (tag === 'DIV') {
          const directText = Array.from(el.childNodes)
            .filter(n => n.nodeType === 3).map(n => n.textContent.trim()).join(' ').trim();
          if (directText && countChars(directText) > 5) pushText(directText);
          for (const c of el.children) walk(c);
          return;
        }
        for (const c of el.children) walk(c);
      }

      walk(root);
      return sections.filter(s => s.count > 0);
    }

    function getPageTitle(doc, url) {
      const t = doc.querySelector('title');
      if (t && t.textContent.trim()) return t.textContent.trim().split(/[|\-–—]/)[0].trim();
      const h1 = doc.querySelector('h1');
      if (h1 && h1.textContent.trim()) return h1.textContent.trim();
      return url;
    }

    function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

    async function startCrawl() {
      const rawUrl = document.getElementById('urlInput').value.trim();
      if (!rawUrl) return;

      let baseUrl;
      try { baseUrl = new URL(rawUrl).toString(); } catch (_) {
        showError('正しいURLを入力してください');
        return;
      }

      shouldStop = false;
      grandTotalValue = 0;

      document.getElementById('analyzeBtn').disabled = true;
      document.getElementById('stopBtn').style.display = 'block';
      document.getElementById('errorBox').style.display = 'none';
      document.getElementById('resultsWrap').style.display = 'none';
      document.getElementById('progressWrap').style.display = 'block';
      document.getElementById('pageList').innerHTML = '';

      const maxPages = getMaxPages();
      const parsedBase = new URL(baseUrl);
      const baseHostname = parsedBase.hostname;
      const basePath = parsedBase.pathname;
      const excludePatterns = document.getElementById('excludeInput').value
        .split(',').map(s => s.trim().toLowerCase()).filter(Boolean);
      const visited = new Set();
      const queue = [baseUrl];
      const pageResults = [];

      updateProgress(0, null, '最初のページを取得中...');

      while (queue.length > 0 && pageResults.length < maxPages && !shouldStop) {
        const url = queue.shift();
        if (visited.has(url)) continue;
        visited.add(url);

        updateProgress(pageResults.length, null, url);

        try {
          const html = await fetchPage(url);
          const doc = parseDoc(html);
          const title = getPageTitle(doc, url);

          // Extract links before cleaning
          const links = extractInternalLinks(doc, baseHostname, url, basePath, excludePatterns);
          links.forEach(l => { if (!visited.has(l)) queue.push(l); });

          cleanDoc(doc);
          const main = getMainContent(doc);
          const sections = extractSections(main);
          const total = sections.reduce((s, sec) => s + sec.count, 0);

          if (total > 0) {
            pageResults.push({ url, title, total, sections });
            grandTotalValue += total;
            renderPageCard({ url, title, total, sections });
            updateGrandTotal(grandTotalValue, pageResults.length);
          }
        } catch (_) {
          // skip failed pages silently
        }

        updateProgress(pageResults.length, maxPages, queue[0] || '');
        if (queue.length > 0 && !shouldStop) await sleep(DELAY);
      }

      finishCrawl(pageResults);
    }

    function stopCrawl() {
      shouldStop = true;
    }

    function finishCrawl(results) {
      document.getElementById('analyzeBtn').disabled = false;
      document.getElementById('stopBtn').style.display = 'none';
      document.getElementById('progressWrap').style.display = 'none';

      if (results.length === 0) {
        showError('テキストが見つかりませんでした');
        return;
      }

      document.getElementById('resultsWrap').style.display = 'block';
    }

    function updateProgress(done, total, currentUrl) {
      document.getElementById('progressText').textContent =
        shouldStop ? '停止しています...' : 'ページを取得中...';
      document.getElementById('progressCount').textContent =
        total ? `${done} / ${Math.min(total, done + 50)}` : `${done} ページ取得済`;
      document.getElementById('progressCurrent').textContent = currentUrl || '';
      if (total) {
        document.getElementById('progressFill').style.width = `${Math.min(100, (done / total) * 100)}%`;
      }
    }

    function updateGrandTotal(total, pageCount) {
      document.getElementById('grandTotal').textContent = total.toLocaleString();
      document.getElementById('grandMeta').innerHTML = `取得ページ数: ${pageCount}`;
      document.getElementById('resultsWrap').style.display = 'block';
    }

    function recalcPageTotal(card) {
      const rows = card.querySelectorAll('.sec-row');
      let total = 0;
      rows.forEach(row => {
        const cb = row.querySelector('.exclude-sec-check');
        if (!cb.checked) total += parseInt(row.dataset.count || '0');
      });
      card.dataset.count = total;
      card.querySelector('.page-count').innerHTML = `${total.toLocaleString()}<span>文字</span>`;
      recalcTotal();
    }

    function recalcTotal() {
      const cards = document.querySelectorAll('.page-card');
      let total = 0;
      let excluded = 0;
      cards.forEach(card => {
        const cb = card.querySelector('.exclude-check');
        if (!cb.checked) {
          total += parseInt(card.dataset.count || '0');
        } else {
          excluded++;
        }
      });
      grandTotalValue = total;
      document.getElementById('grandTotal').textContent = total.toLocaleString();
      document.getElementById('grandMeta').textContent =
        `取得ページ数: ${cards.length}（除外: ${excluded}）`;
    }

    function renderPageCard(page) {
      const maxSec = page.sections.length > 0 ? Math.max(...page.sections.map(s => s.count)) : 1;
      const shortUrl = page.url.replace(/^https?:\/\//, '').replace(/\/$/, '');

      const card = document.createElement('div');
      card.className = 'page-card';
      card.dataset.count = page.total;

      // ページヘッダー
      const header = document.createElement('div');
      header.className = 'page-header';
      header.innerHTML = `
        <input type="checkbox" class="exclude-check" title="このページを除外">
        <div class="page-chevron">▶</div>
        <div class="page-info">
          <div class="page-title">${escHtml(page.title)}</div>
          <div class="page-url">${escHtml(shortUrl)}</div>
        </div>
        <a class="page-link" href="${escHtml(page.url)}" target="_blank" title="ページを開く" onclick="event.stopPropagation()">↗ 開く</a>
        <div class="page-count">${page.total.toLocaleString()}<span>文字</span></div>
      `;

      // アコーディオン（チェックボックスとリンク以外クリックで開閉）
      header.addEventListener('click', e => {
        if (e.target.classList.contains('exclude-check') || e.target.classList.contains('page-link')) return;
        card.classList.toggle('open');
      });
      header.querySelector('.exclude-check').addEventListener('change', function () {
        card.classList.toggle('excluded', this.checked);
        recalcTotal();
      });

      // セクション一覧
      const sectionsWrap = document.createElement('div');
      sectionsWrap.className = 'page-sections';

      page.sections.forEach(sec => {
        const row = document.createElement('div');
        row.className = 'sec-row';
        row.dataset.count = sec.count;

        const fullText = (sec.texts || []).join('\n');

        // チェックボックス
        const cb = document.createElement('input');
        cb.type = 'checkbox';
        cb.className = 'exclude-sec-check';
        cb.title = 'このセクションを除外';
        cb.addEventListener('change', function () {
          row.classList.toggle('excluded-sec', this.checked);
          recalcPageTotal(card);
        });

        // セクション情報
        const info = document.createElement('div');
        info.className = 'sec-info';

        const titleEl = document.createElement('div');
        titleEl.className = 'sec-title';
        titleEl.textContent = sec.title || '（タイトルなし）';

        // 編集可能テキスト
        const textEl = document.createElement('div');
        textEl.className = 'sec-fulltext';
        textEl.contentEditable = 'true';
        textEl.textContent = fullText;
        textEl.addEventListener('input', () => {
          const newCount = (textEl.textContent || '').replace(/\s/g, '').length;
          row.dataset.count = newCount;
          countEl.innerHTML = `${newCount.toLocaleString()}<span>文字</span>`;
          recalcPageTotal(card);
        });

        info.appendChild(titleEl);
        info.appendChild(textEl);

        // 文字数表示
        const countEl = document.createElement('div');
        countEl.className = 'sec-count';
        countEl.innerHTML = `${sec.count.toLocaleString()}<span>文字</span>`;

        row.appendChild(cb);
        row.appendChild(info);
        row.appendChild(countEl);
        sectionsWrap.appendChild(row);
      });

      card.appendChild(header);
      card.appendChild(sectionsWrap);
      document.getElementById('pageList').appendChild(card);
    }

    function toggleCard(chevron) {
      chevron.closest('.page-card').classList.toggle('open');
    }

    function showError(msg) {
      const box = document.getElementById('errorBox');
      box.textContent = msg;
      box.style.display = 'block';
    }

    function copyTotal() {
      navigator.clipboard.writeText(String(grandTotalValue)).then(() => {
        const btn = document.querySelector('.copy-btn');
        btn.textContent = 'コピーしました！';
        setTimeout(() => btn.textContent = '合計をコピー', 1500);
      });
    }

    function escHtml(s) {
      return String(s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    document.getElementById('urlInput').addEventListener('keydown', e => {
      if (e.key === 'Enter') startCrawl();
    });
  </script>
</body>
</html>
